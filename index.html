<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11131b">
  <title>Simon Says — Memory Game</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #11131b;
      color: #f5f4f0;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --muted: #9295a3;
      --line: rgba(255, 255, 255, .09);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(59, 63, 91, .2), transparent 49%),
        #11131b;
    }

    button { font: inherit; }

    .game {
      width: min(100%, 470px);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #a6a8b4;
      font-size: .73rem;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 11vw, 4rem);
      font-weight: 800;
      letter-spacing: -.075em;
      line-height: 1;
    }

    h1 span { color: #a99af7; }

    .subtitle {
      margin: 13px 0 27px;
      color: var(--muted);
      font-size: .95rem;
    }

    .score-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat {
      padding: 13px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, .035);
      text-align: left;
    }

    .stat-label {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 1.35rem;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
    }

    .board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 27px;
      background: rgba(255, 255, 255, .035);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .28);
    }

    .pad {
      aspect-ratio: 1.14;
      border: 0;
      border-radius: 19px;
      cursor: pointer;
      opacity: .73;
      position: relative;
      transition: opacity .12s, transform .12s, filter .12s, box-shadow .12s;
      -webkit-tap-highlight-color: transparent;
    }

    .pad::after {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255, 255, 255, .17);
      border-radius: inherit;
      content: "";
      pointer-events: none;
    }

    .pad:hover { opacity: .88; }
    .pad:active, .pad.lit {
      opacity: 1;
      filter: brightness(1.42) saturate(1.13);
      transform: scale(.975);
      box-shadow: 0 0 32px var(--glow), inset 0 0 26px rgba(255, 255, 255, .19);
    }

    .pad:focus-visible, .control:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
      z-index: 1;
    }

    .pad:disabled { cursor: default; }
    .green { --glow: rgba(66, 222, 154, .55); background: #168b64; }
    .red { --glow: rgba(255, 91, 112, .55); background: #bd4057; }
    .yellow { --glow: rgba(255, 210, 91, .55); background: #bd8b2f; }
    .blue { --glow: rgba(103, 167, 255, .55); background: #416fca; }

    .message {
      min-height: 24px;
      margin: 19px 0 15px;
      color: #d7d4e5;
      font-size: .93rem;
      font-weight: 600;
    }

    .message.error { color: #ff8291; }
    .message.success { color: #73e5b3; }

    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .control {
      min-height: 45px;
      padding: 0 19px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, .06);
      color: #f5f4f0;
      cursor: pointer;
      font-size: .88rem;
      font-weight: 700;
      transition: background .15s, transform .15s;
    }

    .control:hover { background: rgba(255, 255, 255, .11); }
    .control:active { transform: translateY(1px); }
    .control.primary { border-color: transparent; background: #a99af7; color: #181522; }
    .control.primary:hover { background: #b9adff; }

    .hint {
      margin: 23px 0 0;
      color: #737684;
      font-size: .78rem;
      line-height: 1.6;
    }

    @media (max-width: 380px) {
      .board { gap: 9px; padding: 9px; border-radius: 22px; }
      .pad { border-radius: 15px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="game">
    <p class="eyebrow">A little test of memory</p>
    <h1>Simon <span>Says</span></h1>
    <p class="subtitle">Watch the pattern. Repeat it without a mistake.</p>

    <section class="score-row" aria-label="Game scores">
      <div class="stat"><span class="stat-label">Round</span><span class="stat-value" id="round">0</span></div>
      <div class="stat"><span class="stat-label">Best</span><span class="stat-value" id="best">0</span></div>
    </section>

    <section class="board" aria-label="Simon Says game board">
      <button class="pad green" data-pad="0" aria-label="Green pad" disabled></button>
      <button class="pad red" data-pad="1" aria-label="Red pad" disabled></button>
      <button class="pad yellow" data-pad="2" aria-label="Yellow pad" disabled></button>
      <button class="pad blue" data-pad="3" aria-label="Blue pad" disabled></button>
    </section>

    <p class="message" id="message" aria-live="polite">Press start when you're ready.</p>
    <div class="controls">
      <button class="control primary" id="start">Start game</button>
      <button class="control" id="sound" aria-pressed="true">Sound on</button>
    </div>
    <p class="hint">Each round adds one new color. Repeat the full sequence to keep going.</p>
  </main>

  <script>
    (() => {
      const pads = [...document.querySelectorAll(".pad")];
      const roundDisplay = document.querySelector("#round");
      const bestDisplay = document.querySelector("#best");
      const message = document.querySelector("#message");
      const startButton = document.querySelector("#start");
      const soundButton = document.querySelector("#sound");
      const frequencies = [329.63, 261.63, 220, 164.81];
      let sequence = [];
      let inputIndex = 0;
      let playing = false;
      let soundEnabled = true;
      let audioContext;
      let best = readBest();

      bestDisplay.textContent = String(best);

      function readBest() {
        try {
          const value = Number(localStorage.getItem("simon-says-best"));
          return Number.isSafeInteger(value) && value >= 0 ? value : 0;
        } catch {
          return 0;
        }
      }

      function saveBest(value) {
        try {
          localStorage.setItem("simon-says-best", String(value));
        } catch {
          message.textContent = "Best score will last for this visit only.";
        }
      }

      function setMessage(text, kind = "") {
        message.textContent = text;
        message.className = `message${kind ? ` ${kind}` : ""}`;
      }

      function playTone(index) {
        if (!soundEnabled) return;
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        audioContext ??= new AudioContextClass();
        if (audioContext.state === "suspended") audioContext.resume();

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = "sine";
        oscillator.frequency.value = frequencies[index];
        gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.16, audioContext.currentTime + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.28);
        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.29);
      }

      function flash(index, duration = 360) {
        pads[index].classList.add("lit");
        playTone(index);
        window.setTimeout(() => pads[index].classList.remove("lit"), duration);
      }

      function wait(ms) {
        return new Promise(resolve => window.setTimeout(resolve, ms));
      }

      async function showSequence() {
        playing = false;
        pads.forEach(pad => { pad.disabled = true; });
        setMessage("Watch the pattern...");
        await wait(450);
        for (const index of sequence) {
          flash(index);
          await wait(540);
        }
        inputIndex = 0;
        playing = true;
        pads.forEach(pad => { pad.disabled = false; });
        setMessage("Your turn — repeat the pattern.");
      }

      async function startGame() {
        sequence = [];
        inputIndex = 0;
        playing = false;
        roundDisplay.textContent = "0";
        startButton.textContent = "Restart game";
        pads.forEach(pad => { pad.disabled = true; });
        await nextRound();
      }

      async function nextRound() {
        sequence.push(Math.floor(Math.random() * pads.length));
        roundDisplay.textContent = String(sequence.length);
        await showSequence();
      }

      async function handlePad(index) {
        if (!playing) return;
        playing = false;
        flash(index, 190);
        if (sequence[inputIndex] !== index) {
          pads.forEach(pad => { pad.disabled = true; });
          const score = sequence.length - 1;
          if (score > best) {
            best = score;
            bestDisplay.textContent = String(best);
            saveBest(best);
          }
          setMessage(`Not quite! You reached round ${score}. Try again?`, "error");
          startButton.textContent = "Play again";
          return;
        }

        inputIndex++;
        if (inputIndex === sequence.length) {
          if (sequence.length > best) {
            best = sequence.length;
            bestDisplay.textContent = String(best);
            saveBest(best);
          }
          setMessage("Nice memory! Next round...", "success");
          await wait(550);
          await nextRound();
        } else {
          playing = true;
        }
      }

      pads.forEach((pad, index) => {
        pad.addEventListener("click", () => handlePad(index));
      });

      startButton.addEventListener("click", startGame);
      soundButton.addEventListener("click", () => {
        soundEnabled = !soundEnabled;
        soundButton.textContent = soundEnabled ? "Sound on" : "Sound off";
        soundButton.setAttribute("aria-pressed", String(soundEnabled));
      });
    })();
  </script>
</body>
</html>
